apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.104.1
    releaseName: tailscale
    namespace: tailscale
    includeCRDs: true
    valuesFile: ./values.yaml
resources:
  - ./externalsecret.yaml
  - ./clusterexternalsecret.yaml
