apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: camply-web
    repo: oci://ghcr.io/juftin/charts
    version: 2.5.0
    releaseName: camply
    namespace: default
    includeCRDs: true
    valuesFile: ./values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
patches:
  # Match Gateway API defaults so chart backend references stay in sync.
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: camply-app
    patch: |-
      - op: add
        path: /spec/rules/0/backendRefs/0/group
        value: ""
      - op: add
        path: /spec/rules/0/backendRefs/0/kind
        value: Service
      - op: add
        path: /spec/rules/0/backendRefs/0/weight
        value: 1
      - op: add
        path: /spec/rules/1/backendRefs/0/group
        value: ""
      - op: add
        path: /spec/rules/1/backendRefs/0/kind
        value: Service
      - op: add
        path: /spec/rules/1/backendRefs/0/weight
        value: 1
