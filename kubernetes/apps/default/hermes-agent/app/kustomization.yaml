apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.0.1
    releaseName: hermes-agent
    namespace: default
    includeCRDs: true
    valuesFile: ./values.yaml
resources:
  - ./generator.yaml
  - ./externalsecret.yaml
  - ./pushsecret.yaml
  - ./httproute.yaml
  - ./ingress.yaml
