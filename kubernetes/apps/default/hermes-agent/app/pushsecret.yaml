# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hermes-agent
  namespace: default
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: Replace
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: hermes-agent-secret
  data:
    - match:
        secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        remoteRef:
          remoteKey: hermes-agent
          property: password
    - match:
        secretKey: username
        remoteRef:
          remoteKey: hermes-agent
          property: username
    - match:
        secretKey: url
        remoteRef:
          remoteKey: hermes-agent
          property: url
