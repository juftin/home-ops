controllers:
  hermes-agent:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: v0.22.2
        # Bypass the root s6 entrypoint; Kubernetes restarts both processes on failure.
        command: [/bin/bash, -c]
        args:
          - |
            set -euo pipefail
            /bin/sh /opt/hermes/docker/stage2-hook.sh
            if [ -f /etc/hermes/agent-browser-executable-path ]; then
              export AGENT_BROWSER_EXECUTABLE_PATH="$(cat /etc/hermes/agent-browser-executable-path)"
            fi
            trap 'kill "$gateway_pid" "$dashboard_pid" 2>/dev/null || true' EXIT
            trap 'exit 143' TERM INT
            hermes gateway run &
            gateway_pid=$!
            hermes dashboard --host 0.0.0.0 --port 9119 --no-open &
            dashboard_pid=$!
            wait -n "$gateway_pid" "$dashboard_pid"
            exit 1
        env:
          HOME: /opt/data
          HERMES_DASHBOARD_HOST: 0.0.0.0
          HERMES_DASHBOARD_PORT: &dashboardPort 9119
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          HERMES_WRITE_SAFE_ROOT: /opt/data
          API_SERVER_ENABLED: "true"
          API_SERVER_HOST: 0.0.0.0
          API_SERVER_PORT: &apiPort 8642
          API_SERVER_KEY:
            valueFrom:
              secretKeyRef:
                name: hermes-agent-secret
                key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: *dashboardPort
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 30
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: *dashboardPort
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness: *probes
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: hermes-agent
    ports:
      http:
        port: *dashboardPort
      api:
        port: *apiPort
persistence:
  run:
    type: emptyDir
    globalMounts:
      - path: /run
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  data:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /opt/data
route:
  app:
    hostnames:
      - hermes.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-oauth-admin
        namespace: network
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /v1
        backendRefs:
          - port: api
      - backendRefs:
          - port: http
