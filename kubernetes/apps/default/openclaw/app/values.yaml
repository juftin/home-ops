controllers:
  openclaw:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      config:
        image: &image
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.10.1
        command: [node]
        args:
          - -e
          - |-
            const fs = require('node:fs');
            const dir = '/home/node/.openclaw';
            fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
            if (!fs.existsSync(dir + '/openclaw.json')) {
              fs.copyFileSync('/config/openclaw.json', dir + '/openclaw.json');
              fs.chmodSync(dir + '/openclaw.json', 0o600);
            }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
    containers:
      app:
        image: *image
        args: [node, openclaw.mjs, gateway, --bind, lan, --port, "18789"]
        env:
          HOME: /home/node
          OPENCLAW_HOME: /home/node
          OPENCLAW_STATE_DIR: /home/node/.openclaw
          OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
          OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
          OPENCLAW_DISABLE_BONJOUR: "1"
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secret
                key: OPENCLAW_GATEWAY_TOKEN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: &port 18789
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: openclaw
    ports:
      http:
        port: *port
configMaps:
  config:
    data:
      openclaw.json: |-
        {
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "port": 18789,
            "auth": { "mode": "token" },
            "controlUi": {
              "allowedOrigins": ["https://openclaw.${SECRET_DOMAIN}"]
            },
            "trustedProxies": ["10.42.0.0/16"]
          }
        }
persistence:
  home:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /home/node
  config:
    type: configMap
    identifier: config
    advancedMounts:
      openclaw:
        config:
          - path: /config
            readOnly: true
route:
  app:
    enabled: false
