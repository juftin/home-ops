controllers:
  openclaw:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      config:
        image: &image
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.10.3
        command: [node]
        args:
          - -e
          - |-
            const fs = require('node:fs');
            const dir = '/home/node/.openclaw';
            fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
            if (!fs.existsSync(dir + '/openclaw.json')) {
              fs.copyFileSync('/config/openclaw.json', dir + '/openclaw.json');
              fs.chmodSync(dir + '/openclaw.json', 0o600);
            }
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      install-agents:
        image: *image
        env:
          HOME: /home/node
          PATH: &path /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        command: [/bin/bash, /opt/agent-tools/install-agents.sh]
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      install-antigravity:
        image: *image
        env:
          HOME: /home/node
          # renovate: datasource=npm depName=antigravity-claude-proxy
          PROXY_VERSION: 2.8.7
        command: [/bin/bash, -c]
        args:
          - |-
            set -euo pipefail
            npm install --global --allow-scripts=better-sqlite3 --prefix /home/node/.local "antigravity-claude-proxy@${PROXY_VERSION}"
            node openclaw.mjs config set --strict-json models.providers.antigravity-proxy "$(cat /config/antigravity-provider.json)"
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
    containers:
      app:
        image: *image
        args: [node, openclaw.mjs, gateway, --bind, lan, --port, "18789"]
        env:
          HOME: /home/node
          PATH: *path
          OPENCLAW_HOME: /home/node
          OPENCLAW_STATE_DIR: /home/node/.openclaw
          OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
          OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
          OPENCLAW_DISABLE_BONJOUR: "1"
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secret
                key: OPENCLAW_GATEWAY_TOKEN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: &port 18789
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
      antigravity-proxy:
        image: *image
        command: [node]
        args: [/home/node/.local/lib/node_modules/antigravity-claude-proxy/src/index.js]
        env:
          HOME: /home/node
          HOST: 127.0.0.1
          PORT: "8080"
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec: &proxy-health
                command:
                  - node
                  - -e
                  - "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              exec: *proxy-health
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec: *proxy-health
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: openclaw
    ports:
      http:
        port: *port
configMaps:
  config:
    data:
      antigravity-provider.json: |-
        {
          "baseUrl": "http://127.0.0.1:8080",
          "apiKey": "local-proxy",
          "api": "anthropic-messages",
          "models": [
            {
              "id": "claude-sonnet-4-6",
              "name": "Claude Sonnet 4.6 (Antigravity)",
              "reasoning": false,
              "input": ["text", "image"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 200000,
              "maxTokens": 16384
            },
            {
              "id": "claude-sonnet-4-6-thinking",
              "name": "Claude Sonnet 4.6 Thinking (Antigravity)",
              "reasoning": true,
              "input": ["text", "image"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 200000,
              "maxTokens": 16384
            },
            {
              "id": "claude-opus-4-6-thinking",
              "name": "Claude Opus 4.6 Thinking (Antigravity)",
              "reasoning": true,
              "input": ["text", "image"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 200000,
              "maxTokens": 32000
            },
            {
              "id": "gemini-3.8-flash-tiered",
              "name": "Gemini 3.8 Flash (Antigravity)",
              "reasoning": true,
              "input": ["text", "image"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 1048576,
              "maxTokens": 65536
            },
            {
              "id": "gemini-3.6-flash-high",
              "name": "Gemini 3.6 Flash High (Antigravity)",
              "reasoning": true,
              "input": ["text", "image"],
              "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 },
              "contextWindow": 1048576,
              "maxTokens": 65536
            }
          ]
        }
      openclaw.json: |-
        {
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "port": 18789,
            "auth": { "mode": "token" },
            "controlUi": {
              "allowedOrigins": ["https://openclaw.${SECRET_DOMAIN}"]
            },
            "trustedProxies": ["10.42.0.0/16"]
          }
        }
persistence:
  agent-tools:
    type: configMap
    name: agent-tools
    advancedMounts:
      openclaw:
        install-agents:
          - path: /opt/agent-tools
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /home/node
  config:
    type: configMap
    identifier: config
    advancedMounts:
      openclaw:
        config:
          - path: /config
            readOnly: true
        install-antigravity:
          - path: /config
            readOnly: true
route:
  app:
    hostnames:
      - openclaw.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-oauth-admin
        namespace: network
        sectionName: https
