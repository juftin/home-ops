apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: herdr
    namespace: default
    includeCRDs: true
    valuesFile: ./values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
resources:
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: herdr-scripts
    files:
      - install-runtime.sh
      - start.sh
generatorOptions:
  disableNameSuffixHash: true
