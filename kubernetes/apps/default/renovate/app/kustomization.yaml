apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
helmCharts:
  - name: renovate
    repo: https://renovatebot.github.io/helm-charts
    version: 46.366.5
    releaseName: renovate
    namespace: default
    valuesFile: ./values.yaml
resources:
  - ./externalsecret.yaml
  - ./serviceaccount.yaml
configMapGenerator:
  - name: renovate-runner
    files:
      - config.js
      - github-app-token.cjs
generatorOptions:
  disableNameSuffixHash: true
