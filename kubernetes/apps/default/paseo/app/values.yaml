controllers:
  paseo:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      install-agents:
        image: &image
          repository: ghcr.io/getpaseo/paseo
          tag: 0.14.0
        env:
          HOME: /home/paseo
          PATH: &path /home/paseo/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        command: [/bin/bash, /opt/agent-tools/install-agents.sh]
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
    containers:
      app:
        image: *image
        env:
          PATH: *path
          PASEO_LISTEN: 0.0.0.0:6767
          PASEO_WEB_UI_ENABLED: "true"
          PASEO_RELAY_ENABLED: "false"
          PASEO_HOSTNAMES: paseo.${SECRET_DOMAIN},paseo.$(TAILSCALE_DNS_SUFFIX)
          PASEO_TRUSTED_PROXIES: loopback,10.42.0.0/16
          PASEO_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: paseo-secret
                key: PASEO_PASSWORD
        envFrom:
          - secretRef:
              name: tailscale-config
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: &port 6767
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: *port
persistence:
  agent-tools:
    type: configMap
    name: agent-tools
    advancedMounts:
      paseo:
        install-agents:
          - path: /opt/agent-tools
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /home/paseo
  workspace:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /workspace
route:
  app:
    hostnames:
      - paseo.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-oauth-admin
        namespace: network
        sectionName: https
ingress:
  tailscale:
    suffix: tailscale
    className: tailscale
    defaultBackend:
      service:
        name: paseo
        port:
          number: *port
    tls:
      - hosts:
          - paseo
