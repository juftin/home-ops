# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ntfy-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: ntfy
        property: NTFY_AUTH_USERS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: ntfy
        property: NTFY_AUTH_TOKENS
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
