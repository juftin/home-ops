apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pomerium
  namespace: pomerium
spec:
  jobLabel: pomerium
  namespaceSelector:
    matchNames:
      - pomerium
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      metricRelabelings:
        # Pomerium v0.34.1 omits service labels when the controller name contains a space.
        # Remove this filter once Pomerium labels both metrics streams correctly.
        - action: drop
          sourceLabels: [__name__, controller, name, service]
          regex: 'controller_runtime_.*;bootstrap pod/[^;]+;;|workqueue_.*;;bootstrap pod/[^;]+;'
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/name: pomerium
