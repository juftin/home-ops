apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/pomerium/ingress-controller/config/default?ref=v0.34.1
  - ./pvc.yaml
  - ./pomerium.yaml
  - ./podmonitor.yaml
  - ./google-idp-secret.sops.yaml
  - ./groups.sops.yaml
  - ./ingresses.yaml
images:
  - name: pomerium/ingress-controller
    # renovate: datasource=docker depName=pomerium/ingress-controller
    newTag: v0.34.1
replacements:
  - source:
      kind: ConfigMap
      name: pomerium-groups
      fieldPath: data.admins
    targets:
      - select:
          kind: Ingress
          labelSelector: pomerium.io/group=admins
        fieldPaths:
          - metadata.annotations.[ingress.pomerium.io/policy]
        options:
          create: true
  - source:
      kind: ConfigMap
      name: pomerium-groups
      fieldPath: data.users
    targets:
      - select:
          kind: Ingress
          labelSelector: pomerium.io/group=users
        fieldPaths:
          - metadata.annotations.[ingress.pomerium.io/policy]
        options:
          create: true
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: pomerium
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pomerium
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            securityContext:
              fsGroup: 65532
            containers:
              - name: pomerium
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pomerium
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: pomerium-data
  - target:
      version: v1
      kind: Service
      name: pomerium-proxy
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: pomerium-proxy
        annotations:
          lbipam.cilium.io/ips: "192.168.1.149"
          external-dns.alpha.kubernetes.io/hostname: "oauth.${SECRET_DOMAIN}"
