apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentsview
  namespace: agentsview
  labels:
    pomerium.io/group: admins
spec:
  ingressClassName: pomerium
  rules:
    - host: "agentsview.${SECRET_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentsview-app
                port:
                  number: 8080
  tls:
    - hosts:
        - "agentsview.${SECRET_DOMAIN}"
---
