apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentsview
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agentsview-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentsview
        property: POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AGENTSVIEW_AUTH_TOKEN
      remoteRef:
        key: agentsview
        property: AGENTSVIEW_AUTH_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
