apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3code
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: t3code
    namespace: t3code
    includeCRDs: true
    valuesFile: ./values.yaml
resources:
  - ./agentsview-externalsecret.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: t3code-scripts
    files:
      - install-runtime.sh
generatorOptions:
  disableNameSuffixHash: true
