apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: ntfy-strip-prefix
  namespace: ntfy
spec:
  urlRewrite:
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: '^/ntfy(/.*)$'
        substitution: '\1'
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: ntfy-not-found
  namespace: ntfy
spec:
  directResponse:
    statusCode: 404
