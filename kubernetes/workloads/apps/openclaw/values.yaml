controllers:
  openclaw:
    replicas: 1
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      agentsview-config:
        image:
          repository: ghcr.io/kenn-io/agentsview
          tag: 0.46.1
        command: [/bin/sh, -ec]
        args:
          - 'mkdir -p -m 700 /data/agentsview; if [ ! -f /data/agentsview/config.toml ]; then cp /config/config.toml /data/agentsview/config.toml; chmod 600 /data/agentsview/config.toml; fi'
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      config:
        image: &image
          repository: ghcr.io/openclaw/openclaw
          tag: 2026.11.1
        command: [node]
        args:
          - -e
          - |-
            const fs = require('node:fs');
            const dir = '/home/node/.openclaw';
            fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
            if (!fs.existsSync(dir + '/openclaw.json')) {
              fs.copyFileSync('/config/openclaw.json', dir + '/openclaw.json');
              fs.chmodSync(dir + '/openclaw.json', 0o600);
            }
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      install-agents:
        image: *image
        env:
          HOME: /home/node
          PATH: &path /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        command: [/bin/bash, /opt/agent-tools/install-agents.sh]
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
    containers:
      agentsview:
        image:
          repository: ghcr.io/kenn-io/agentsview
          tag: 0.46.1
        args: ["pg", "push", "--watch", "--interval", "5m"]
        env:
          HOME: /nonexistent
          AGENTSVIEW_DATA_DIR: /data/agentsview
          AGENTSVIEW_NO_DAEMON: "1"
          AGENTSVIEW_PG_URL: postgres://agentsview@agentsview-db.agentsview.svc.cluster.local:5432/agentsview?sslmode=disable
          PGPASSWORD:
            valueFrom:
              secretKeyRef:
                name: agentsview-secret
                key: POSTGRES_PASSWORD
          CLAUDE_PROJECTS_DIR: /sources/.claude/projects
          CODEX_SESSIONS_DIR: /sources/.codex/sessions
          GEMINI_DIR: /sources/.gemini
          OPENCLAW_DIR: /sources/.openclaw
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 1Gi
      app:
        image: *image
        args: [node, openclaw.mjs, gateway, --bind, lan, --port, "18789"]
        env:
          HOME: /home/node
          PATH: *path
          OPENCLAW_HOME: /home/node
          OPENCLAW_STATE_DIR: /home/node/.openclaw
          OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
          OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
          OPENCLAW_DISABLE_BONJOUR: "1"
          OPENCLAW_GATEWAY_TOKEN:
            valueFrom:
              secretKeyRef:
                name: openclaw-secret
                key: OPENCLAW_GATEWAY_TOKEN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: &port 18789
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /startupz
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
defaultPodOptions:
  terminationGracePeriodSeconds: 60
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: openclaw
    ports:
      http:
        port: *port
configMaps:
  agentsview:
    data:
      config.toml: |-
        local_machine_name = "openclaw"
        [pg]
        allow_insecure = true
  config:
    data:
      openclaw.json: |-
        {
          "gateway": {
            "mode": "local",
            "bind": "lan",
            "port": 18789,
            "auth": { "mode": "token" },
            "controlUi": {
              "allowedOrigins": ["https://openclaw.${SECRET_DOMAIN}"]
            },
            "trustedProxies": ["10.42.0.0/16"]
          }
        }
persistence:
  agent-tools:
    type: configMap
    name: agent-tools
    advancedMounts:
      openclaw:
        install-agents:
          - path: /opt/agent-tools
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      openclaw:
        app:
          - path: /home/node
        install-agents:
          - path: /home/node
        config:
          - path: /home/node
        agentsview:
          - path: /sources
            readOnly: true
  config:
    type: configMap
    identifier: config
    advancedMounts:
      openclaw:
        config:
          - path: /config
            readOnly: true
  agentsview-data:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      openclaw:
        agentsview-config:
          - path: /data
        agentsview:
          - path: /data
  agentsview-config:
    type: configMap
    identifier: agentsview
    advancedMounts:
      openclaw:
        agentsview-config:
          - path: /config
            readOnly: true
route:
  app:
    hostnames:
      - openclaw.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-oauth-admin
        namespace: network
        sectionName: https
