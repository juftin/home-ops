apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.3.0
    releaseName: paseo
    namespace: paseo
    includeCRDs: true
    valuesFile: ./values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
resources:
  - ./agentsview-externalsecret.yaml
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
