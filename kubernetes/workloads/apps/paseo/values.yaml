controllers:
  paseo:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    initContainers:
      agentsview-config:
        image:
          repository: ghcr.io/kenn-io/agentsview
          tag: 0.46.1
        command: [/bin/sh, -ec]
        args:
          - 'mkdir -p -m 700 /data/agentsview; if [ ! -f /data/agentsview/config.toml ]; then cp /config/config.toml /data/agentsview/config.toml; chmod 600 /data/agentsview/config.toml; fi'
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
      install-agents:
        image: &image
          repository: ghcr.io/getpaseo/paseo
          tag: 0.15.4
        env:
          HOME: /home/paseo
          PATH: &path /home/paseo/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        command: [/bin/bash, /opt/agent-tools/install-agents.sh]
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
    containers:
      agentsview:
        image:
          repository: ghcr.io/kenn-io/agentsview
          tag: 0.46.1
        args: ["pg", "push", "--watch", "--interval", "5m"]
        env:
          HOME: /nonexistent
          AGENTSVIEW_DATA_DIR: /data/agentsview
          AGENTSVIEW_NO_DAEMON: "1"
          AGENTSVIEW_PG_URL: postgres://agentsview@agentsview-db.agentsview.svc.cluster.local:5432/agentsview?sslmode=disable
          PGPASSWORD:
            valueFrom:
              secretKeyRef:
                name: agentsview-secret
                key: POSTGRES_PASSWORD
          CLAUDE_PROJECTS_DIR: /sources/.claude/projects
          CODEX_SESSIONS_DIR: /sources/.codex/sessions
          GEMINI_DIR: /sources/.gemini
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 1Gi
      app:
        image: *image
        env:
          PATH: *path
          PASEO_LISTEN: 0.0.0.0:6767
          PASEO_WEB_UI_ENABLED: "true"
          PASEO_RELAY_ENABLED: "false"
          PASEO_HOSTNAMES: paseo.${SECRET_DOMAIN},paseo.$(TAILSCALE_DNS_SUFFIX)
          PASEO_TRUSTED_PROXIES: loopback,10.42.0.0/16
          PASEO_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: paseo-secret
                key: PASEO_PASSWORD
        envFrom:
          - secretRef:
              name: tailscale-config
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: &port 6767
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
defaultPodOptions:
  terminationGracePeriodSeconds: 60
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: *port
persistence:
  agent-tools:
    type: configMap
    name: agent-tools
    advancedMounts:
      paseo:
        install-agents:
          - path: /opt/agent-tools
            readOnly: true
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      paseo:
        app:
          - path: /home/paseo
        install-agents:
          - path: /home/paseo
        agentsview:
          - path: /sources
            readOnly: true
  workspace:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 20Gi
    advancedMounts:
      paseo:
        app:
          - path: /workspace
        install-agents:
          - path: /workspace
  agentsview-data:
    storageClass: node-local
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      paseo:
        agentsview-config:
          - path: /data
        agentsview:
          - path: /data
  agentsview-config:
    type: configMap
    identifier: agentsview
    advancedMounts:
      paseo:
        agentsview-config:
          - path: /config
            readOnly: true
route:
  app:
    hostnames:
      - paseo.${SECRET_DOMAIN}
    parentRefs:
      - name: envoy-oauth-admin
        namespace: network
        sectionName: https
ingress:
  tailscale:
    suffix: tailscale
    className: tailscale
    defaultBackend:
      service:
        name: paseo
        port:
          number: *port
    tls:
      - hosts:
          - paseo
configMaps:
  agentsview:
    data:
      config.toml: |-
        local_machine_name = "paseo"
        [pg]
        allow_insecure = true
