apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: camply-web
    repo: oci://ghcr.io/juftin/charts
    version: v2.6.0
    releaseName: camply
    namespace: camply
    includeCRDs: true
    valuesFile: ./values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
replicas:
  - name: camply-frontend
    count: 0
  - name: camply-backend
    count: 0
  - name: camply-worker
    count: 0
  - name: camply-beat
    count: 0
  - name: camply-postgresql
    count: 0
  - name: camply-valkey
    count: 0
  - name: camply-prometheus
    count: 0
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: camply-migrate-.*
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
