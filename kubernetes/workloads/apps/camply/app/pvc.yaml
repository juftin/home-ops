apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camply-db-data
  namespace: camply
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: node-local
  volumeName: pvc-14945e27-a7db-41c4-8818-74a489721c72
  resources:
    requests:
      storage: 10Gi
