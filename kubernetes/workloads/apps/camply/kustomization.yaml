apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: camply-web
    repo: oci://ghcr.io/juftin/charts
    version: v2.14.1
    releaseName: camply
    namespace: camply
    includeCRDs: true
    valuesFile: ./values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
