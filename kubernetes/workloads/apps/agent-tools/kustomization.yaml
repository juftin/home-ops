apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: agent-tools
    namespace: paseo
    files:
      - install-agents.sh
  - name: agent-tools
    namespace: openclaw
    files:
      - install-agents.sh
  - name: agent-tools
    namespace: herdr
