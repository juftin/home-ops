apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-ops
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - folder: kube-system
                  wave: '0'
                - folder: cert-manager
                  wave: '1'
                - folder: external-secrets
                  wave: '1'
                - folder: network
                  wave: '2'
                - folder: tailscale
                  wave: '2'
                - folder: apps
                  wave: '3'
                - folder: observability
                  wave: '4'
          - git:
              repoURL: https://github.com/juftin/home-ops.git
              revision: refs/heads/main
              directories:
                - path: 'kubernetes/workloads/{{ .folder }}/*'
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        home-ops.io/namespace: '{{ if eq .folder "apps" }}{{ .path.basename }}{{ else }}{{ .folder }}{{ end }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: '{{ if eq .folder "kube-system" }}kube-system{{ else }}home-ops{{ end }}'
      source:
        repoURL: https://github.com/juftin/home-ops.git
        targetRevision: refs/heads/main
        path: '{{ .path.path }}/app'
        plugin:
          name: kustomize-substitute-secret-domain
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ if eq .folder "apps" }}{{ .path.basename }}{{ else }}{{ .folder }}{{ end }}'
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: Gateway
          jqPathExpressions:
            - .spec.listeners[].tls.mode
            - .spec.listeners[].tls.certificateRefs[].group
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.parentRefs[].group
            - .spec.parentRefs[].kind
            # Ignore only the API's default catch-all, so path edits still trigger sync.
            - '.spec.rules[] | select(.matches == [{"path":{"type":"PathPrefix","value":"/"}}]) | .matches'
        - group: gateway.envoyproxy.io
          kind: SecurityPolicy
          jqPathExpressions:
            - .spec.oidc.refreshToken
            - .spec.oidc.clientSecret.group
            - .spec.oidc.clientSecret.kind
            - .spec.authorization.rules[].principal.jwt.claims[].valueType
            - .spec.jwt.providers[].remoteJWKS.cacheDuration
        - group: apps
          kind: StatefulSet
          name: loki
          namespace: observability
          jqPathExpressions:
            - .spec.template.spec.containers[].livenessProbe.httpGet.scheme
            - .spec.template.spec.containers[].terminationMessagePath
            - .spec.template.spec.containers[].terminationMessagePolicy
            - .spec.template.spec.containers[].resources
            - .spec.template.spec.dnsPolicy
            - .spec.template.spec.restartPolicy
            - .spec.template.spec.schedulerName
            - .spec.template.spec.serviceAccount
            - .spec.template.spec.volumes[].configMap.defaultMode
            - .spec.updateStrategy.type
            - .spec.updateStrategy.rollingUpdate.maxUnavailable
            - .spec.volumeClaimTemplates[].spec.volumeMode
            - .spec.volumeClaimTemplates[].status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
