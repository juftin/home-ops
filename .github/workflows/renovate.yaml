# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: renovate
on:
  workflow_dispatch:
  schedule:
    - cron: "0/15 * * * *"
  push:
    paths:
      - .github/workflows/renovate.yaml
      - .github/renovate-config.js
      - .renovaterc.json5
    branches:
      - main
jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: renovate
        uses: renovatebot/github-action@973d3e5a68e735a444e8c03432b66eedb343c302 # v46.2.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-config.js
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 43.288.0
        env:
          RENOVATE_REPOSITORY: ${{ github.repository }}
          RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
          LOG_LEVEL: info
