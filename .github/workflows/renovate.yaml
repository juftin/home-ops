# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: renovate
on:
  workflow_dispatch:
  schedule:
    - cron: "0/15 * * * *"
  push:
    paths:
      - .github/workflows/renovate.yaml
      - .github/renovate-config.js
      - .renovaterc.json5
    branches:
      - main
jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-config.js
          # renovate: datasource=github-releases depName=renovatebot/renovate
          renovate-version: 44.264.1
        env:
          RENOVATE_REPOSITORY: ${{ github.repository }}
          RENOVATE_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RENOVATE_DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
          LOG_LEVEL: info
